<!-- AI Assistant Component -->
<div id="ai-assistant-container" class="fixed bottom-6 right-6 z-[9999] font-sans">
    <!-- Chat Button is now in header.html -->

    <!-- Chat Window -->
    <div id="ai-chat-window" class="fixed top-24 right-6 w-[320px] md:w-[380px] h-[500px] bg-void-900/95 backdrop-blur-xl border border-white/10 rounded-3xl shadow-2xl flex flex-col transition-all duration-500 transform -translate-y-4 opacity-0 pointer-events-none origin-top-right">
        <!-- Header -->
        <div class="p-4 border-b border-white/10 flex items-center justify-between bg-white/5 rounded-t-3xl backdrop-blur-md">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-white/5 border border-white/10 flex items-center justify-center overflow-hidden">
                    <img src="assets/images/ai-icons8.png" alt="AI" class="w-full h-full object-contain invert brightness-200 p-1">
                </div>
                <div>
                    <h3 class="text-sm font-bold text-white leading-tight">Cardinal AI</h3>
                    <div class="flex items-center gap-1.5">
                        <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                        <span class="text-[10px] text-slate-400 uppercase tracking-widest">Online</span>
                    </div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <!-- Voice Output Toggle -->
                <button id="voice-toggle-btn" class="text-slate-400 hover:text-cyan transition-all p-2 rounded-lg hover:bg-white/5 relative group" title="Toggle voice responses (Ctrl+S)">
                    <i class="fas fa-volume-up text-sm"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-emerald-500 rounded-full opacity-0 transition-opacity" id="voice-indicator"></span>
                    <div class="absolute -bottom-8 right-0 bg-black/90 text-white text-[10px] px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Voice Off</div>
                </button>
                <button id="ai-close-btn" class="text-slate-400 hover:text-white transition-colors p-2">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>

        <!-- Messages Area -->
        <div id="ai-messages" class="flex-1 overflow-y-auto p-4 space-y-4 scrollbar-hide">
            <!-- AI Welcome Message -->
            <div class="flex items-start gap-3">
                <div class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center flex-shrink-0 mt-1 overflow-hidden">
                    <img src="assets/images/ai-icons8.png" alt="AI" class="w-full h-full object-contain invert brightness-200 p-1">
                </div>
                <div class="bg-white/5 border border-white/10 rounded-2xl rounded-tl-none p-3 text-sm text-slate-200 max-w-[85%]">
                    Hi there! 👋 I'm your Digital Cardinal assistant. How can I help you grow your business today?
                </div>
            </div>
            
            <!-- Dynamic Messages will go here -->
        </div>

        <!-- Quick Suggestions -->
        <div id="ai-suggestions" class="px-4 py-2 flex gap-2 overflow-x-auto scrollbar-hide border-t border-white/5">
            <button class="suggestion-btn whitespace-nowrap px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-[11px] text-slate-300 hover:bg-white/10 transition-all">What services?</button>
            <button class="suggestion-btn whitespace-nowrap px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-[11px] text-slate-300 hover:bg-white/10 transition-all">Tell me about SEO</button>
            <button class="suggestion-btn whitespace-nowrap px-3 py-1.5 rounded-full bg-white/5 border border-white/10 text-[11px] text-slate-300 hover:bg-white/10 transition-all">AI Agents</button>
        </div>

        <!-- Input Area -->
        <div class="p-4 bg-white/5 rounded-b-3xl">
            <form id="ai-form" class="relative">
                <input type="text" id="ai-input" placeholder="Type or speak your question..." class="w-full bg-black/40 border border-white/10 rounded-2xl py-3 pl-4 pr-24 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cardinal/50 transition-all" autocomplete="off">
                
                <!-- Microphone Button (Disabled)
                <button type="button" id="voice-input-btn" class="absolute right-12 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl bg-white/5 border border-white/10 text-slate-400 hover:text-cyan hover:border-cyan/50 flex items-center justify-center transition-all active:scale-90 group" title="Voice input (Ctrl+M)">
                    <i class="fas fa-microphone text-xs"></i>
                    <div class="absolute inset-0 rounded-xl bg-cyan/20 opacity-0 animate-ping pointer-events-none" id="mic-pulse"></div>
                </button>
                -->
                
                <!-- Send Button -->
                <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 w-8 h-8 rounded-xl bg-cardinal text-white flex items-center justify-center hover:bg-cardinal-glow transition-all active:scale-90">
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </form>
            <p class="text-[10px] text-slate-500 text-center mt-3">Powered by Cardinal AI System • Voice Enabled</p>
        </div>
    </div>
</div>

<style>
    /* Button Float Animation */
    @keyframes ai-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }
    
    .ai-float-animation {
        animation: ai-float 4s ease-in-out infinite;
    }

    #ai-chat-window.open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
    }
    
    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
    .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }

    .message-user {
        border-bottom-right-radius: 0 !important;
    }
    .message-ai {
        border-bottom-left-radius: 0 !important;
    }
</style>
