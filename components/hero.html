<section id="hero" class="relative min-h-screen flex items-center pt-12 md:pt-20 pb-24 overflow-hidden">
  <!-- HERO BACKGROUND VIDEO -->
  <!-- HERO BACKGROUND LAYERS -->
  
  <!-- 1. Static Poster (Visible Immediately) -->
  <div class="absolute inset-0 z-0 bg-black">
      <img src="assets/images/hero-poster.jpg" alt="" class="w-full h-full object-cover opacity-80">
  </div>

  <!-- 2. Video (Fades in when ready) -->
  <video
    id="heroVideo"
    class="hero-bg-video opacity-0 transition-opacity duration-[2000ms] ease-in-out absolute inset-0 z-10 w-full h-full object-cover"
    autoplay
    muted
    playsinline
    loop
    preload="auto"
  >
    <source src="assets/video/hero-aurora.mp4" type="video/mp4" />
  </video>


  <!-- lighter gradient over video -->
  <div class="absolute inset-0 z-10 bg-gradient-to-b from-black/30 via-transparent to-black pointer-events-none"></div>
  <div class="relative z-20 w-full max-w-[1400px] mx-auto px-6">
    <div class="grid grid-cols-1 lg:grid-cols-[40%_60%] gap-4 lg:gap-12 items-center">

      <!-- RIGHT: Visual (Left on desktop, Top on mobile) -->
      <div class="order-1 lg:order-1 relative flex flex-col items-center lg:items-start justify-center lg:justify-start lg:-translate-x-[110px] lg:mt-0">
        <img
          src="assets/images/hero-logo-transparent.png"
          alt="Digital Cardinal Logo"
          class="relative w-64 sm:w-80 lg:w-[650px] pointer-events-none animate-float mix-blend-normal [mask-image:radial-gradient(closest-side,black_60%,transparent_95%)]" />
      </div>

      <!-- LEFT: Text (Right on desktop, Bottom on mobile) -->
      <div class="order-2 lg:order-2 relative text-center lg:text-left mt-0 md:mt-20 lg:mt-0">
        <!-- subtle glow -->
        <div class="pointer-events-none absolute -inset-10 rounded-3xl
                    bg-[radial-gradient(circle_at_25%_25%,rgba(168,85,247,0.18),transparent_60%),
                        radial-gradient(circle_at_85%_55%,rgba(34,211,238,0.12),transparent_62%),
                        radial-gradient(circle_at_20%_90%,rgba(239,68,68,0.14),transparent_60%)]
                    blur-3xl opacity-80">
        </div>

        <div class="relative z-10">
          <h1 class="mt-0 text-4xl sm:text-5xl md:text-6xl font-extrabold leading-[1.1] tracking-tight text-white font-sans uppercase">
            <span class="inline-block md:whitespace-nowrap"></span>Build a <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-400 to-red-500">Premium</span></span><br/>
            <span class="inline-block md:whitespace-nowrap">Online <span class="text-transparent bg-clip-text bg-gradient-to-r from-red-600 via-red-500 to-rose-400">Presence</span></span>
          </h1>

          <p class="mt-2 text-base sm:text-lg md:text-xl lg:text-2xl font-medium max-w-2xl mx-auto lg:mx-0">
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-white via-white to-amber-400">
              Premium web experiences built for you.
            </span>
          </p>

          <!-- Core Services -->
          <div class="mt-4 md:mt-10 flex flex-col items-center lg:items-start gap-5 md:gap-7 max-w-full">
            <!-- Rotator Row -->
            <div class="flex flex-col md:flex-row items-center justify-center lg:justify-start gap-2 md:gap-4 flex-nowrap w-full">
                <span class="text-[10px] md:text-xs text-white uppercase tracking-[0.3em] font-extrabold whitespace-nowrap shrink-0 opacity-100">Our Services:</span>
                
                <div class="px-6 py-2.5 rounded-full bg-white/10 border border-white/20 backdrop-blur-md shadow-[0_0_20px_rgba(255,255,255,0.05)]">
                    <span id="service-rotator" class="text-xl sm:text-2xl md:text-3xl font-bold leading-none whitespace-nowrap transition-all duration-300" aria-live="off">Web Development</span>
                </div>
            </div>

            <!-- Enhanced Process Timeline -->
            <div class="mt-4 relative w-full max-w-full">
                <!-- Label -->
                <div class="text-[10px] text-slate-400 uppercase tracking-widest font-bold mb-6 text-center lg:text-left">
                    Our Workflow:
                </div>

                <!-- Timeline Container -->
                <div class="relative flex items-center justify-between w-full lg:max-w-2xl px-2">
                    <!-- Progress Line (Background with Color Sync) -->
                    <div class="absolute top-1/2 left-0 w-full h-[1.5px] bg-gradient-to-r from-white/20 via-cyan-500/30 via-cardinal/30 to-amber-500/30 -translate-y-[15px] z-0"></div>
                    
                    <!-- Step 1: Silver/White (Start) -->
                    <div class="relative z-10 flex flex-col items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-void-950 border border-white/40 flex items-center justify-center text-[10px] font-bold text-white shadow-[0_0_15px_rgba(255,255,255,0.2)]">1</div>
                        <span class="text-[10px] md:text-xs font-semibold text-white whitespace-nowrap uppercase tracking-tighter">Consult</span>
                    </div>

                    <!-- Step 2: Cyan/Blue (Growth) -->
                    <div class="relative z-10 flex flex-col items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-void-950 border border-cyan-400/50 flex items-center justify-center text-[10px] font-bold text-cyan-400 shadow-[0_0_15px_rgba(34,211,238,0.2)]">2</div>
                        <span class="text-[10px] md:text-xs font-semibold text-cyan-400 whitespace-nowrap uppercase tracking-tighter">Design</span>
                    </div>

                    <!-- Step 3: Cardinal Red (Core) -->
                    <div class="relative z-10 flex flex-col items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-void-950 border border-cardinal/50 flex items-center justify-center text-[10px] font-bold text-cardinal shadow-[0_0_15px_rgba(230,0,35,0.2)]">3</div>
                        <span class="text-[10px] md:text-xs font-semibold text-cardinal whitespace-nowrap uppercase tracking-tighter">Deliver</span>
                    </div>

                    <!-- Step 4: Gold/Amber (Success) -->
                    <div class="relative z-10 flex flex-col items-center gap-3">
                        <div class="w-8 h-8 rounded-full bg-void-950 border border-amber-400 flex items-center justify-center text-[10px] font-bold text-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.2)]">4</div>
                        <span class="text-[10px] md:text-xs font-semibold text-amber-500 whitespace-nowrap uppercase tracking-tighter">Paid on Approval</span>
                    </div>
                </div>

                <!-- Mobile-Only Scroll Indicator (Positioned between Step 2 & 3) -->
                <div class="lg:hidden flex justify-center mt-8 -mb-4">
                    <div class="scroll-premium-circle flex">
                        <i class="fas fa-chevron-down text-cardinal"></i>
                    </div>
                </div>
            </div>
            </div>
          </div>

          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Scroll Indicator (Bottom for Desktop only) -->
  <div class="scroll-premium-circle hidden lg:flex absolute left-1/2 -translate-x-1/2 bottom-10 z-20">
      <i class="fas fa-chevron-down"></i>
  </div>
</section>
